<!DOCTYPE html>
<html>
<head>
<body>

    <input type="text" id="userInput">
    <button onclick="checkInput()">check</button>

    <script>
        function checkInput() {

            let num = document.getElementById("userInput").value;

            if (num ===""||isNaN(num)) {
                alert("please insert a number! ");
            }
            else if 
                (Number(num)<10) {
                    alert("The number is lower than 10");
                }
            else if 
                (Number(num)>10) {
                    alert("The number is higher than 10");
                }
            else {
                alert("The number is equal to 10");
            }
            }
    </script>
</body>
</head>
</html>
